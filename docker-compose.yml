services:
  # ─── Firebase Emulator Suite ───────────────────────────────────────────────
  emulators:
    build:
      context: ./emulators
      dockerfile: Dockerfile
    working_dir: /app
    # stop_grace_period gives the emulator time to export data before SIGKILL
    stop_grace_period: 30s
    command: >
      bash -c "
      echo 'rules_version = \"2\"; service firebase.storage { match /b/{bucket}/o { match /{allPaths=**} { allow read, write: if true; } } }' > /app/storage.rules &&
      echo '{
        \"functions\":[{\"source\":\"functions/send_email\",\"runtime\":\"python312\",\"codebase\":\"send-email\"},{\"source\":\"functions/orchestrator\",\"runtime\":\"python312\",\"codebase\":\"orchestrator\"},{\"source\":\"functions/send_push\",\"runtime\":\"python312\",\"codebase\":\"send-push\"}],
        \"storage\":{\"rules\":\"storage.rules\"},
        \"emulators\":{
          \"auth\":{\"port\":9099,\"host\":\"0.0.0.0\"},
          \"firestore\":{\"port\":8080,\"host\":\"0.0.0.0\"},
          \"storage\":{\"port\":9199,\"host\":\"0.0.0.0\"},
          \"functions\":{\"port\":5001,\"host\":\"0.0.0.0\"},
          \"pubsub\":{\"port\":8085,\"host\":\"0.0.0.0\"},
          \"eventarc\":{\"port\":9299,\"host\":\"0.0.0.0\"},
          \"ui\":{\"enabled\":true,\"host\":\"0.0.0.0\",\"port\":4000}
        }
      }' > /app/firebase.json &&
      for fn in functions/send_email functions/orchestrator functions/send_push; do
        if [ ! -d $$fn/venv ]; then
          python3.12 -m venv $$fn/venv;
        fi &&
        $$fn/venv/bin/pip install -q -r $$fn/requirements.txt;
      done &&
      IMPORT_FLAG='' &&
      chmod -R 755 /emulator-data 2>/dev/null;
      if [ -d /emulator-data/saved/firestore_export ] || [ -d /emulator-data/saved/auth_export ]; then
        echo '[emulators] Importing saved data from /emulator-data/saved' &&
        IMPORT_FLAG='--import /emulator-data/saved';
      else
        echo '[emulators] No saved data found — starting fresh';
      fi &&
      exec firebase emulators:start
      --project spartacus-artes-marciais
      --only firestore,auth,storage,functions,pubsub,eventarc
      --export-on-exit /emulator-data/saved
      $$IMPORT_FLAG"
    ports:
      - "4000:4000"   # Emulator UI
      - "5001:5001"   # Functions
      - "8080:8080"   # Firestore
      - "8085:8085"   # Pub/Sub
      - "9099:9099"   # Auth
      - "9199:9199"   # Storage
      - "9299:9299"   # Eventarc
    volumes:
      - ./emulator-data:/emulator-data
      - ../backend/functions/send_email:/app/functions/send_email
      - ../backend/functions/orchestrator:/app/functions/orchestrator
      - ../backend/functions/send_push:/app/functions/send_push
    environment:
      - FIREBASE_TOKEN=${FIREBASE_TOKEN:-}
      - GOOGLE_CLOUD_PROJECT=${FIREBASE_PROJECT_ID:-spartacus-artes-marciais}
      - GCLOUD_PROJECT=${FIREBASE_PROJECT_ID:-spartacus-artes-marciais}
      # Functions run inside this container — tell firebase-admin to use
      # emulator endpoints instead of real GCP (avoids ADC credential errors)
      - FIRESTORE_EMULATOR_HOST=localhost:8080
      - FIREBASE_AUTH_EMULATOR_HOST=localhost:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=localhost:9199
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── Backend FastAPI ───────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - FIRESTORE_EMULATOR_HOST=emulators:8080
      - FIREBASE_AUTH_EMULATOR_HOST=emulators:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=emulators:9199
      - PUBSUB_EMULATOR_HOST=emulators:8085
      - EVENTARC_EMULATOR_HOST=emulators:9299
      - GOOGLE_CLOUD_PROJECT=${FIREBASE_PROJECT_ID:-spartacus-artes-marciais}
      - ROOT_PROJECT_ID=${ROOT_PROJECT_ID:-spartacus-artes-marciais}
    depends_on:
      emulators:
        condition: service_healthy
